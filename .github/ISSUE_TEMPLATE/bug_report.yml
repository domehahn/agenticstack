name: Bug Report
description: Report a rendering, navigation, search, accessibility, or build issue on AgenticStack.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL or Route
      placeholder: "https://agenticstack.eu/blog"
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
