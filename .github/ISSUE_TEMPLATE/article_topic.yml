name: Article / Topic Proposal
description: Propose a technical article or multi-part series on Agentic Engineering, DevSecOps, or Platform Engineering.
title: "[Content]: "
labels: ["content"]
body:
  - type: input
    id: topic
    attributes:
      label: Primary Topic
      placeholder: "agentic-engineering | devsecops | ai-engineering | platform-engineering | security | software-architecture"
    validations:
      required: true
  - type: textarea
    id: abstract
    attributes:
      label: Abstract & Key Takeaways
      description: What problem, architecture, or engineering trade-off does this article cover?
    validations:
      required: true
